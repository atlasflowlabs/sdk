      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: Create an environment
      tags:
        - Environments
  /projects/{id}/environments/{envId}:
    delete:
      description: Soft-deletes an environment. Production environments cannot be deleted; delete the project instead.
      operationId: delete-environment
      parameters:
        - description: The project ID (UUID).
          in: path
          name: id
