    MachineAuthenticatedIngress:
      additionalProperties: false
      properties:
        key:
          description: Plaintext key required in the X-Atlasflow-Key request header.
          minLength: 1
          type: string
        ports:
          description: Ports or inclusive port ranges that require X-Atlasflow-Key.
          items:
            type: string
          minItems: 1
          type: array
      required:
        - ports
        - key
      type: object
    MachineImageResponse:
      additionalProperties: false
      properties:
        id:
