components:
  schemas:
    CreateDeploymentInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CreateDeploymentInputBody.json
          format: uri
          readOnly: true
          type: string
        environment_slug:
          description: The environment slug to deploy. Defaults to production.
          type: string
        project_slug:
          description: The project slug to deploy.
          type: string
      required:
        - project_slug
      type: object
    CreateEnvironmentInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CreateEnvironmentInputBody.json
          format: uri
          readOnly: true
          type: string
        branch:
          description: The branch to track. Defaults to main.
          type: string
        build_machine_tier:
          description: The build machine tier. Defaults to standard.
          type: string
        dockerfile_path:
          description: The Dockerfile path. Defaults to Dockerfile.
          type: string
        min_replicas:
          description: The minimum number of VM replicas. Defaults to 1.
          format: int64
          type: integer
        root_directory:
          description: The build root directory. Defaults to /.
          type: string
        runtime_machine_tier:
          description: The runtime machine tier. Defaults to small.
          type: string
        slug:
          description: The environment slug.
          type: string
        type:
          description: "The environment type: preview."
          type: string
      required:
        - slug
        - type
      type: object
    CreateImageInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CreateImageInputBody.json
          format: uri
          readOnly: true
          type: string
        image_pull_secret:
          description: Source registry credentials in username:password format.
          type: string
        registry:
          description: OCI registry hostname. Defaults to docker.io.
          type: string
        repository:
          description: Repository path, for example alpine/curl.
          type: string
        tag:
          description: Image tag. Defaults to latest.
          type: string
      required:
        - repository
      type: object
    CreateMachineInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CreateMachineInputBody.json
          format: uri
          readOnly: true
          type: string
        command:
          description: Optional argv that replaces the OCI image's default process arguments. Commands are executed directly without a shell.
          items:
            type: string
          type:
            - array
            - "null"
        image_id:
          description: A workspace-owned OCI image ID.
          type: string
        machine_tier:
          description: "Runtime tier: small, medium, or large. Defaults to small."
          examples:
            - small
          type: string
        network:
          $ref: "#/components/schemas/MachineNetwork"
          description: Optional ingress policy. Machines deny all ingress when omitted.
        region:
          description: Region where the Machine runs. Defaults to de-fra-1.
          examples:
            - de-fra-1
          type: string
      required:
        - image_id
      type: object
    CreateProjectInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CreateProjectInputBody.json
          format: uri
          readOnly: true
          type: string
        dockerfile_path:
          description: Path to the Dockerfile, relative to the root directory. Defaults to Dockerfile.
          type: string
        github_repository:
          description: The linked GitHub repository in owner/repo format.
          type: string
        name:
          description: The project name.
          type: string
        root_directory:
          description: Repository path the project builds from. Defaults to /.
          type: string
      required:
        - name
        - github_repository
      type: object
    CursorListResponseImageResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CursorListResponseImageResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/ImageResponse"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/CursorMeta"
      required:
        - data
        - meta
      type: object
    CursorListResponseMachineResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CursorListResponseMachineResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/MachineResponse"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/CursorMeta"
      required:
        - data
        - meta
      type: object
    CursorMeta:
      additionalProperties: false
      properties:
        cursor_end:
          description: Cursor of the last resource in this page. Pass it as after to request the next page.
          type: string
        cursor_start:
          description: Cursor of the first resource in this page. Empty when the page has no resources.
          type: string
        has_next:
          description: Whether another page is available after cursor_end.
          type: boolean
      required:
        - cursor_start
        - cursor_end
        - has_next
      type: object
    DeleteEnvironmentOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/DeleteEnvironmentOutputBody.json
          format: uri
          readOnly: true
          type: string
        deleted:
          type: boolean
      required:
        - deleted
      type: object
    DeploymentDomainResponse:
      additionalProperties: false
      properties:
        id:
          description: The domain ID.
          type: string
        name:
          description: The hostname. The URL is https://<name>.
          type: string
        verified_at:
          description: When the domain was verified, if applicable.
          format: date-time
          type: string
      required:
        - id
        - name
      type: object
    DeploymentEnvironmentRef:
      additionalProperties: false
      properties:
        id:
          description: The environment ID.
          type: string
        slug:
          description: The environment slug.
          type: string
      required:
        - id
        - slug
      type: object
    DeploymentLogLineResponse:
      additionalProperties: false
      properties:
        created_at:
          description: When the log line was recorded.
          format: date-time
          type: string
        id:
          description: The build log row ID.
          type: string
        level:
          description: The log level (INFO, WARN, ERROR).
          type: string
        step_name:
          description: The build step name this line belongs to, if any.
          type: string
        text:
          description: The log line text.
          type: string
      required:
        - id
        - text
        - level
        - created_at
      type: object
    DeploymentProjectRef:
      additionalProperties: false
      properties:
        id:
          description: The project ID.
          type: string
        slug:
          description: The project slug.
          type: string
      required:
        - id
        - slug
      type: object
    DeploymentResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/DeploymentResponse.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the deployment was created.
          format: date-time
          type: string
        desired_state:
          description: The desired state (run or stop).
          type: string
        environment:
          $ref: "#/components/schemas/DeploymentEnvironmentRef"
          description: The environment this deployment belongs to.
        github_branch:
          description: The branch the deployment builds from.
          type: string
        github_commit:
          description: The commit SHA the deployment builds from.
          type: string
        github_commit_author:
          description: The commit author's GitHub login.
          type: string
        github_commit_message:
          description: The first line of the commit message.
          type: string
        id:
          description: The deployment ID.
          type: string
        project:
          $ref: "#/components/schemas/DeploymentProjectRef"
          description: The project this deployment belongs to.
        status:
          description: Derived deployment status (INITIALIZING, BUILDING, DEPLOYING, HEALTHCHECK, RUNNING, STOPPED, FAILED, PENDING).
          type: string
        status_changed_at:
          description: When the deployment status last changed.
          format: date-time
          type: string
      required:
        - id
        - project
        - environment
        - status
        - desired_state
        - github_commit
        - github_branch
        - github_commit_message
        - github_commit_author
        - created_at
        - status_changed_at
      type: object
    EnvironmentResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/EnvironmentResponse.json
          format: uri
          readOnly: true
          type: string
        branch:
          description: The branch this environment tracks.
          type: string
        build_machine_tier:
          description: "The build machine tier: standard, enhanced, or performance."
          type: string
        created_at:
          format: date-time
          type: string
        dockerfile_path:
          description: The Dockerfile path relative to the root directory.
          type: string
        id:
          description: The environment ID (UUID).
          type: string
        min_replicas:
          description: The minimum number of VM replicas.
          format: int64
          type: integer
        root_directory:
          description: The build root directory.
          type: string
        runtime_machine_tier:
          description: "The runtime machine tier: small, medium, or large."
          type: string
        slug:
          description: The environment slug, unique within the project.
          type: string
        type:
          description: "The environment type: production or preview."
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - slug
        - type
        - branch
        - root_directory
        - dockerfile_path
        - build_machine_tier
        - runtime_machine_tier
        - min_replicas
        - created_at
        - updated_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FeatureFlagsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/FeatureFlagsResponse.json
          format: uri
          readOnly: true
          type: string
        flags:
          description: Names of feature flags enabled for the workspace.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - flags
      type: object
    GithubAccountResponse:
      additionalProperties: false
      properties:
        account:
          description: The GitHub account (login) that installed the app.
          type: string
      required:
        - account
      type: object
    GithubInstallURLOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/GithubInstallURLOutputBody.json
          format: uri
          readOnly: true
          type: string
        url:
          description: The GitHub App install URL to open in a browser.
          type: string
      required:
        - url
      type: object
    GithubRepositoryResponse:
      additionalProperties: false
      properties:
        full_name:
          description: The full owner/repo name.
          type: string
        name:
          description: The repository name.
          type: string
        owner:
          description: The repository owner login.
          type: string
      required:
        - full_name
        - owner
        - name
      type: object
    ImageResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ImageResponse.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the image was created.
          format: date-time
          type: string
        id:
          description: The image ID.
          type: string
        reference:
          description: The canonical image reference.
          type: string
        registry:
          description: The OCI registry hostname.
          type: string
        repository:
          description: The repository path in the registry.
          type: string
        tag:
          description: The image tag.
          type: string
        updated_at:
          description: When the image was last updated.
          format: date-time
          type: string
      required:
        - id
        - registry
        - repository
        - tag
        - reference
        - created_at
        - updated_at
      type: object
    ListResponseDeploymentDomainResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ListResponseDeploymentDomainResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/DeploymentDomainResponse"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ListResponseDeploymentLogLineResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ListResponseDeploymentLogLineResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/DeploymentLogLineResponse"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ListResponseDeploymentResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ListResponseDeploymentResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/DeploymentResponse"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ListResponseEnvironmentResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ListResponseEnvironmentResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/EnvironmentResponse"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ListResponseGithubAccountResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ListResponseGithubAccountResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/GithubAccountResponse"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ListResponseGithubRepositoryResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ListResponseGithubRepositoryResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/GithubRepositoryResponse"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ListResponseProjectResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ListResponseProjectResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/ProjectResponse"
          type:
            - array
            - "null"
      required:
        - data
