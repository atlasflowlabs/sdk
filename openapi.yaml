        - description: The environment ID (UUID).
          in: path
          name: envId
          required: true
          schema:
            description: The environment ID (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostgresDatabaseResponse"
          description: OK
        default:
          content:
            application/problem+json:
