  /images:
    get:
      description: Returns a cursor-paginated list of images in the caller's current workspace.
      operationId: list-images
      parameters:
        - description: Maximum number of images to return. Defaults to 50 and cannot exceed 100.
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of images to return. Defaults to 50 and cannot exceed 100.
            format: int64
            type: integer
        - description: Return resources after this cursor. Use meta.cursor_end from the previous page.
          explode: false
          in: query
          name: after
          schema:
            description: Return resources after this cursor. Use meta.cursor_end from the previous page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorListResponseImageResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: List images
      tags:
        - Images
    post:
      description: Copies an OCI image into the Atlasflow registry and adds it to the caller's current workspace. Registry defaults to docker.io and tag defaults to latest.
      operationId: create-image
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImageInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: Create an image
      tags:
        - Images
  /images/{id}:
    get:
      description: Returns an image by ID from the caller's current workspace.
      operationId: get-image
      parameters:
        - description: The image ID (UUID).
          in: path
          name: id
          required: true
          schema:
            description: The image ID (UUID).
