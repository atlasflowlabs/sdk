          type: string
      required:
        - id
        - name
        - role
        - status
      type: object
    ProjectGitHubStatusResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ProjectGitHubStatusResponse.json
          format: uri
          readOnly: true
          type: string
        connected:
          description: Whether the project's GitHub repository is accessible via an installed app.
          type: boolean
        error:
          description: A human-readable reason when the repository is not connected.
          type: string
        repository:
          description: The linked repository in owner/repo form.
          type: string
      required:
        - connected
        - repository
      type: object
    ProjectResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ProjectResponse.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the project was created.
          format: date-time
          type: string
        github_repository:
          description: Owner/repo of the linked GitHub repository.
          type: string
        id:
          description: The project ID.
          type: string
        name:
          description: The project name.
          type: string
        slug:
          description: URL-safe project slug.
          type: string
        updated_at:
          description: When the project was last updated.
          format: date-time
          type: string
      required:
        - id
        - name
        - slug
        - github_repository
        - created_at
        - updated_at
      type: object
    UpdateEnvironmentInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/UpdateEnvironmentInputBody.json
          format: uri
          readOnly: true
          type: string
        branch:
          description: The branch to track.
          type: string
        build_machine_tier:
          description: The build machine tier.
          type: string
        dockerfile_path:
          description: The Dockerfile path.
          type: string
        min_replicas:
          description: The minimum number of VM replicas.
          format: int64
          type: integer
        root_directory:
          description: The build root directory.
          type: string
        runtime_machine_tier:
          description: The runtime machine tier.
          type: string
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        account_id:
          description: The owning account ID.
          type: string
        created_at:
          description: When the user was created.
          format: date-time
          type: string
        email:
          description: The account's email address.
          type: string
        id:
          description: The user's ID.
          type: string
        name:
          description: The account's display name.
          type: string
      required:
        - id
        - account_id
        - name
        - email
        - created_at
      type: object
    WorkspaceResponse:
      additionalProperties: false
      properties:
        created_at:
          description: When the workspace was created.
          format: date-time
          type: string
        id:
          description: The workspace ID.
          type: string
        name:
          description: The workspace name.
          type: string
        slug:
          description: URL-safe workspace slug.
          type: string
      required:
        - id
        - name
        - slug
        - created_at
      type: object
  securitySchemes:
    apiKey:
      bearerFormat: Atlasflow API key
      description: Atlasflow API key (af_live_...) presented as a bearer token in the Authorization header.
      scheme: bearer
      type: http
info:
  title: Atlasflow REST API
  version: 1.0.0
openapi: 3.1.0
paths:
  /deployments:
    get:
      description: Returns production deployments in the caller's current workspace by default. Filter by project_slug and optional environment_slug to select a project environment.
      operationId: list-deployments
      parameters:
        - description: Filter deployments to a project slug. When environment_slug is omitted, the production environment is used.
          explode: false
          in: query
          name: project_slug
          schema:
            description: Filter deployments to a project slug. When environment_slug is omitted, the production environment is used.
            type: string
        - description: Filter deployments to an environment slug within project_slug.
          explode: false
          in: query
          name: environment_slug
          schema:
            description: Filter deployments to an environment slug within project_slug.
            type: string
        - description: Maximum number of deployments to return. Defaults to all.
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of deployments to return. Defaults to all.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
