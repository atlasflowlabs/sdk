name: Release

# Publishes @atlasflow/sdk to npm when a v* tag is pushed. Uses npm trusted
# publishing (OIDC), so no npm token is stored in this repository. Configure
# this repository and workflow as a trusted publisher for @atlasflow/sdk on
# npmjs.com before the first release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check the tag matches package.json
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Verify generated code, typecheck, and test
        run: |
          npm run generate
          git diff --exit-code
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
