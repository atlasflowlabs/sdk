  /deployments/{id}/logs:
    get:
      description: Returns recent log lines for the deployment. Use type=build for build logs or type=runtime (default) for runtime (VM) logs. Use the tail query parameter to limit the number of lines (default 200, max 1000). This is a snapshot, not a live stream.
      operationId: list-deployment-logs
      parameters:
        - description: The deployment ID (UUID).
          in: path
          name: id
          required: true
          schema:
            description: The deployment ID (UUID).
            type: string
        - description: "Log type: runtime (default) or build."
          explode: false
          in: query
          name: type
          schema:
            description: "Log type: runtime (default) or build."
            type: string
        - description: Maximum number of recent log lines to return. Defaults to 200.
          explode: false
          in: query
          name: tail
          schema:
            description: Maximum number of recent log lines to return. Defaults to 200.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponseDeploymentLogLineResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: List recent deployment logs
      tags:
        - Deployments
  /feature_flags:
    get:
