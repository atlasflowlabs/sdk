          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: Get an image
      tags:
        - Images
  /machines:
    get:
      description: Returns active Machines in the caller's current workspace in descending ID order. Machine root filesystems are ephemeral, so filesystem changes are lost whenever execution stops or restarts.
      operationId: list-machines
      parameters:
        - description: Maximum number of Machines to return. Defaults to 50 and cannot exceed 100.
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of Machines to return. Defaults to 50 and cannot exceed 100.
            format: int64
            type: integer
        - description: Return resources after this cursor. Use meta.cursor_end from the previous page.
          explode: false
          in: query
          name: after
          schema:
            description: Return resources after this cursor. Use meta.cursor_end from the previous page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorListResponseMachineResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: List Machines
      tags:
        - Machines
    post:
      description: Creates a Machine from a workspace-owned OCI image. Execution placement is asynchronous. The root filesystem is ephemeral, and all filesystem changes are lost whenever execution stops or restarts.
      operationId: create-machine
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMachineInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: Create a Machine
      tags:
        - Machines
  /machines/{id}:
    delete:
      description: Accepts asynchronous deletion of an active Machine in the caller's current workspace. The Machine disappears from GET and list responses immediately, while its execution VM is stopped and deleted asynchronously. Repeated deletion returns 404.
      operationId: delete-machine
      parameters:
        - description: The stable Machine ID (UUID).
          in: path
          name: id
          required: true
          schema:
            description: The stable Machine ID (UUID).
            type: string
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: Delete a Machine
      tags:
        - Machines
    get:
      description: Returns an active Machine by its stable ID from the caller's current workspace. The internal execution VM and IP are not exposed. Root filesystem changes are lost whenever execution stops or restarts.
      operationId: get-machine
      parameters:
        - description: The stable Machine ID (UUID).
          in: path
          name: id
          required: true
          schema:
            description: The stable Machine ID (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
      summary: Get a Machine
      tags:
        - Machines
  /me:
